name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security & Vulnerability Audit
        run: pnpm audit --audit-level=critical

      - name: Type Check
        run: pnpm run type:check

      - name: Format Check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Unit Tests & Coverage
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build
        env:
          DATABASE_URL: 'postgres://mock:mock@mock.neondatabase.app/mock'
